#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.043;
fade-out-step = 0.043;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 0.7;

#################################
#           Corners             #
#################################

corner-radius = 10

#################################
#            Blur               #
#################################

blur-method = "dual_kawase"
blur-strength = 3;

#################################
#       General Settings        #
#################################

backend = "glx"
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
use-damage = true;

rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "focused != 1";
  opacity = 0.85;
}, {
  match = "class_g = 'i3lock'";
  opacity = 1;
}, {
  match = "class_g = 'Dunst'";
  opacity = 1;
}, {
  match = "class_g = 'Code'";
  opacity = 1;
}, {
  match = "class_g = 'org.mozilla.firefox'";
  opacity = 1;
}, {
  match = "class_g = 'Polybar'";
  opacity = 0.8;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
  # shader = "my_shader.frag";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
})

#################################
#       Animations              #
#################################

animations = ({
  triggers = ["open"];
  preset = "fly-in";
  direction = "up"
}, {
  triggers = ["close"];
  preset = "fly-out";
  direction = "down"
}, {
  triggers = ["geometry"]
  scale-x = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start = "window-width-before / window-width";
      end = 1;
    }
    scale-y = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start = "window-height-before / window-height";
      end = 1;
    }
    offset-x = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start = "window-x-before - window-x";
      end = 0;
    }
    offset-y = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.22;
      start = "window-y-before - window-y";
      end = 0;
    }

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
})